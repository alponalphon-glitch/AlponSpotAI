name: AlponSpotAI Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Google Maven access
        run: |
          curl -fsS "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.9.3/gradle-8.9.3.pom" -o /dev/null
          echo "Google Maven AGP 8.9.3 is reachable"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build Debug APK
        run: gradle --no-daemon --refresh-dependencies --stacktrace --max-workers=2 :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlponSpotAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
